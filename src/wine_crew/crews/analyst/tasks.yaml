# Paths in {braces} come from AnalystCrew.inputs() at kickoff.

clean_task:
  description: >
    1. Call load_raw with raw_csv_path="{raw_csv}".
    2. Call clean_data with raw_csv_path="{raw_csv}" and output_csv_path="{clean_csv}".
    Report the raw row count, the rows removed by each cleaning rule, the
    dropped columns and the final row count, using only the tool outputs.
  expected_output: >
    A short report of rows in, rows removed per rule (duplicates, missing
    required values), dropped columns and rows out, plus the raw file sha256.
  agent: data_cleaner

eda_task:
  description: >
    1. Call eda_summary with clean_csv_path="{clean_csv}" and output_json_path="{summary_json}".
    2. Call make_charts with clean_csv_path="{clean_csv}" and charts_dir="{charts_dir}".
    3. Call build_html_report with summary_json_path="{summary_json}",
       charts_dir="{charts_dir}" and output_html_path="{report_html}".
    Report the files created and the headline numbers returned by eda_summary.
  expected_output: >
    The paths of eda_summary.json, the charts and eda_report.html, with the
    headline numbers from the eda_summary tool.
  agent: eda_analyst

insights_task:
  description: >
    Call read_eda_summary with summary_json_path="{summary_json}". Using ONLY
    numbers from that JSON (copied or rounded, never computed), write
    insights.md in Hebrew for the wine buyer of a retail chain, in plain
    business language. Country and variety names may stay in English.

    Answer these three questions, each under its own "##" heading:
    1. In which price range does the score stop rising? Use price_bands
       (gain_per_price_doubling and plateau_starts_at_band).
    2. Which countries and varieties give a high score at a low price? Use
       value_countries, value_varieties, by_country and by_variety.
    3. Where is the data biased? Use country_bias and missing_pct.
    End with a short "## המלצות לקנייה" section of 3 bullet points.

    Rules: use "-" bullets, not numbered lists. Do not add numbers that are not
    in the JSON (no differences, ratios or percentages you calculate yourself).
  expected_output: >
    A Markdown document in Hebrew with four "##" sections, every number taken
    from the eda_summary JSON. Output only the Markdown, without code fences.
  agent: insights_writer

contract_task:
  description: >
    1. Call build_contract with clean_csv_path="{clean_csv}", raw_csv_path="{raw_csv}"
       and output_json_path="{contract_json}".
    2. Call validate_contract with clean_csv_path="{clean_csv}" and
       contract_json_path="{contract_json}".
    Report whether validation passed and list every violation exactly as returned.
  expected_output: >
    The contract path, the raw file sha256, the row count, and the validation
    result (passed or the list of violations).
  agent: contract_author
