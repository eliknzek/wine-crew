[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-crew"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real_data: runs on the real raw CSV in data/raw/ (skipped if missing)",
    "llm: calls the real LLM and costs money; run explicitly with `pytest -m llm` (skipped without OPENAI_API_KEY)",
]
addopts = "-m 'not llm'"
