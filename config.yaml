# Single source of truth for seeds, paths and thresholds.
seed: 42

paths:
  raw_csv: data/raw/winemag-data-130k-v2.csv
  artifacts_analyst: artifacts/analyst
  artifacts_scientist: artifacts/scientist
  logs: logs
  contract_template: docs/dataset_contract.json
  clean_data: artifacts/analyst/clean_data.csv
  contract: artifacts/analyst/dataset_contract.json
  eda_summary: artifacts/analyst/eda_summary.json
  charts_dir: artifacts/analyst/charts
  eda_report: artifacts/analyst/eda_report.html
  insights: artifacts/analyst/insights.md
  run_summary: artifacts/run_summary.json
  staging_root: build/runs        # each run writes here first; promoted to artifacts/ only if every gate passed
  contract_check: artifacts/scientist/contract_check.json
  features_csv: artifacts/scientist/features.csv
  model_pkl: artifacts/scientist/model.pkl
  metrics_json: artifacts/scientist/metrics.json
  evaluation_report: artifacts/scientist/evaluation_report.md
  value_ranking: artifacts/scientist/value_ranking.csv
  model_card: artifacts/scientist/model_card.md

data_source:
  kaggle_dataset: zynicide/wine-reviews
  file: winemag-data-130k-v2.csv
  collected_year: 2017        # the reviews were scraped in 2017 (single source)

cleaning:
  vintage_min: 1980
  vintage_max: 2017
  required_columns: [price, country, variety]          # rows missing any of these are dropped
  drop_columns: [region_2, taster_twitter_handle]

features:
  min_category_count: 50   # categories with fewer training rows become "Other"
  numeric: [price, vintage]                     # raw inputs; log_price and vintage_missing are derived in the pipeline
  categorical: [country, province, variety]
  v2_extra: [region_1]                          # used by v2 only

model:
  test_size: 0.2
  cv_folds: 5
  ridge_alpha: 1.0
  hgb:
    max_iter: 300
    learning_rate: 0.1
    max_categories: 255    # HistGradientBoosting supports at most 255 categories per feature
    early_stopping: false
  selection_metric: cv_mae # pick v1/v2 by mean CV MAE on the training set
  value_top_n: 50

eda:
  top_n: 15                       # countries / varieties shown by count
  price_bands: [4, 10, 15, 20, 25, 30, 40, 50, 75, 100, 150, 200, 500, 3300]   # USD edges, right-inclusive
  plateau_gain_per_doubling: 1.0  # mean-points gain per price doubling below this = score stops rising
  vintage_min_count: 50           # vintages with fewer wines are left out of the per-year view
  chart_size: [9, 5.5]            # inches
  chart_dpi: 100

llm:
  model: gpt-4o-mini
  temperature: 0
  price_per_million:            # USD, gpt-4o-mini list price; used for the run cost in the log
    input: 0.15
    cached_input: 0.075
    output: 0.60

checks:
  row_count:
    min: 100000
    max: 130000
