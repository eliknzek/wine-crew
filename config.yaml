# Single source of truth for seeds, paths and thresholds.
seed: 42

paths:
  raw_csv: data/raw/winemag-data-130k-v2.csv
  artifacts_analyst: artifacts/analyst
  artifacts_scientist: artifacts/scientist
  logs: logs
  contract_template: docs/dataset_contract.json
  run_summary: artifacts/run_summary.json

data_source:
  kaggle_dataset: zynicide/wine-reviews
  file: winemag-data-130k-v2.csv

cleaning:
  vintage_min: 1980
  vintage_max: 2017

features:
  min_category_count: 50   # categories with fewer rows become "Other"

model:
  test_size: 0.2
  cv_folds: 5

llm:
  model: gpt-4o-mini
  temperature: 0

checks:
  row_count:
    min: 100000
    max: 130000
